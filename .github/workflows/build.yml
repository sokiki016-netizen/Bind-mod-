name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "=== tail of build.log ==="
          tail -n 80 build.log || true
          echo "=== annotations ==="
          grep -E "error:|warning:|What went wrong|Caused by|Could not|Unresolved|FAILURE" build.log | head -n 25 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done

      - name: Verify jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "bindmod-*.jar" ! -name "*-sources.jar" | head -n1)
          echo "jar: $JAR"
          unzip -l "$JAR" | tail -n 8
          unzip -p "$JAR" fabric.mod.json
          SIZE=$(stat -c%s "$JAR")
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          ENTRIES=$(unzip -l "$JAR" | wc -l)
          # ремап в intermediary: в классах должны быть имена вида class_310
          REMAPPED=$(unzip -p "$JAR" com/sokiki/bindmod/BindModClient.class | strings | grep -c "class_" || true)
          echo "::notice::jar=$SIZE bytes, entries=$ENTRIES, remapped_hits=$REMAPPED, sha256=$SHA"
          if [ "$SIZE" -lt 10000 ]; then echo "::error::jar too small"; exit 1; fi
          if [ "$REMAPPED" -lt 1 ]; then echo "::error::jar не отремаплен в intermediary"; exit 1; fi
          unzip -p "$JAR" fabric.mod.json | grep -q '\${version}' && { echo "::error::version не подставлен в fabric.mod.json"; exit 1; } || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindmod-jar
          path: build/libs/bindmod-*.jar
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          TAG="v$VERSION"
          JAR=$(find build/libs -maxdepth 1 -name "bindmod-${VERSION}.jar" ! -name "*-sources.jar" | head -n1)
          echo "Releasing $TAG with $JAR"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Bind Mod $TAG" \
            --notes "Клиентский мод для Minecraft 1.21.4 (Fabric): бинды команд на клавиши. Меню — правая Alt." \
            --target "$GITHUB_SHA"
          gh release upload "$TAG" "$JAR" --clobber
