name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindmod-jar
          path: build/libs/bindmod-*.jar
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          TAG="v$VERSION"
          JAR=$(find build/libs -maxdepth 1 -name "bindmod-${VERSION}.jar" ! -name "*-sources.jar" | head -n1)
          echo "Releasing $TAG with $JAR"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Bind Mod $TAG" \
            --notes "Клиентский мод для Minecraft 1.21.4 (Fabric): бинды команд на клавиши. Меню — правая Alt." \
            --target "$GITHUB_SHA"
          gh release upload "$TAG" "$JAR" --clobber
